[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-broth"
version = "0.1.0"
description = "Computing without a program counter: 3D spatial dataflow engine vs von Neumann VM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "tensor-broth contributors" }]
keywords = ["dataflow", "cellular-automata", "tensor", "gpu", "benchmark", "von-neumann"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "torch>=2.0"]

[project.scripts]
tensor-broth = "tensor_broth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
